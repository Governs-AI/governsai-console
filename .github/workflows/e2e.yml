name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-e2e:
    name: Platform E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @governs-ai/platform exec playwright install --with-deps chromium

      # Authenticated tests (API keys, policies, decision log) require a seeded
      # user and a running platform. Until the full local stack is wired into
      # CI, we run only the tests that don't need credentials — Playwright
      # test.skip() handles the rest.
      - name: Run E2E
        env:
          E2E_BASE_URL: ${{ vars.E2E_PLATFORM_URL }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_ORG_SLUG: ${{ vars.E2E_TEST_ORG_SLUG }}
        run: |
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "::notice::E2E_PLATFORM_URL not configured; skipping platform E2E run. Set the repo variable to enable."
            exit 0
          fi
          if ! curl -fsS --max-time 10 "${E2E_BASE_URL}" >/dev/null 2>&1; then
            echo "::warning::Platform not reachable at ${E2E_BASE_URL}; skipping."
            exit 0
          fi
          pnpm --filter @governs-ai/platform test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-playwright-report
          path: |
            apps/platform/playwright-report
            apps/platform/test-results
          retention-days: 7
