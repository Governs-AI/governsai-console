name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
  NEXTAUTH_SECRET: ci-nextauth-secret-not-real
  NEXTAUTH_URL: http://localhost:3002
  JWT_SECRET: ci-jwt-secret-not-real
  WEBHOOK_SECRET: ci-webhook-secret-not-real
  NEXT_PUBLIC_APP_URL: http://localhost:3002
  NEXT_PUBLIC_PLATFORM_URL: http://localhost:3002
  PASSWORD_PEPPER: ci-password-pepper-not-real
  OPENAI_API_KEY: ci-openai-key-not-real

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API route tests
        run: pnpm --filter @governs-ai/platform test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: pnpm --filter @governs-ai/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

  # Preview deploys are produced by the native Vercel GitHub integration
  # (the `Vercel` check on each PR). The previous `deploy` job here ran
  # `vercel pull/build/deploy` with no VERCEL_TOKEN secret configured and
  # failed on every PR — see GOV-2267.
  #
  # The dependent `e2e-tests` job has been removed alongside `deploy` because
  # it was always skipped. E2E will be reinstated under task 2.5 with preview
  # URL acquired from the native Vercel deployment_status event.
