name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
  NEXTAUTH_SECRET: ci-nextauth-secret-not-real
  NEXTAUTH_URL: http://localhost:3002
  JWT_SECRET: ci-jwt-secret-not-real
  WEBHOOK_SECRET: ci-webhook-secret-not-real
  NEXT_PUBLIC_APP_URL: http://localhost:3002
  NEXT_PUBLIC_PLATFORM_URL: http://localhost:3002
  PASSWORD_PEPPER: ci-password-pepper-not-real
  OPENAI_API_KEY: ci-openai-key-not-real

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API route tests
        run: pnpm --filter @governs-ai/platform test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: pnpm --filter @governs-ai/db exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Gitleaks CLI binary from the MIT-licensed upstream project.
    # Pinned to release v8.30.1 (commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e).
    # Bump deliberately: update GITLEAKS_VERSION, GITLEAKS_COMMIT_SHA, and GITLEAKS_SHA256.
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_COMMIT_SHA: "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail --silent --show-error --location --retry 3 --output "${archive}" "${url}"

          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status

          tar -xzf "${archive}" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}" gitleaks

          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source=. --redact --verbose --no-banner --exit-code=1
